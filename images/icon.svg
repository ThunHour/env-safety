<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- circuit traces: encryption / AI -->
  <g stroke="#6366f1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M14 40 H28 V30"/>
    <path d="M114 40 H100 V30"/>
    <path d="M14 92 H26"/>
    <path d="M114 92 H102"/>
  </g>
  <g fill="#818cf8">
    <circle cx="28" cy="27" r="4"/>
    <circle cx="100" cy="27" r="4"/>
    <circle cx="14" cy="92" r="4"/>
    <circle cx="114" cy="92" r="4"/>
  </g>
  <!-- shield -->
  <path d="M64 16 L100 29 V60 C100 84 85 101 64 111 C43 101 28 84 28 60 V29 Z" fill="url(#shield)"/>
  <path d="M64 16 L100 29 V60 C100 84 85 101 64 111 Z" fill="#000" opacity="0.12"/>
  <!-- padlock -->
  <path d="M52 58 V48 a12 12 0 0 1 24 0 V58" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <rect x="44" y="56" width="40" height="32" rx="6" fill="#ffffff"/>
  <circle cx="64" cy="69" r="5" fill="#1e1b4b"/>
  <rect x="61.5" y="70" width="5" height="10" rx="2.5" fill="#1e1b4b"/>
</svg>
